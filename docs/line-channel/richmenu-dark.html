<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:2500px;height:1686px}
  html{background:#070b14}
  body{
    background:
      radial-gradient(1500px 820px at 50% -8%, rgba(34,211,238,.16), transparent 60%),
      radial-gradient(1200px 900px at 50% 120%, rgba(59,130,246,.14), transparent 60%),
      linear-gradient(160deg,#0e1b30 0%,#0a1220 55%,#070b14 100%);
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);
    gap:70px;padding:104px;
    font-family:'DejaVu Sans','FreeSans',sans-serif;
  }
  .card{
    position:relative;overflow:hidden;border-radius:44px;
    background:linear-gradient(158deg,rgba(255,255,255,.11),rgba(255,255,255,.035));
    border:1.5px solid rgba(255,255,255,.14);
    box-shadow:0 34px 66px -18px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.18);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;
  }
  .card::before{content:"";position:absolute;top:-45%;left:50%;transform:translateX(-50%);
    width:130%;height:85%;background:radial-gradient(closest-side,rgba(255,255,255,.09),transparent);pointer-events:none}
  .badge{width:156px;height:156px;border-radius:38px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 18px 34px -8px var(--glow), inset 0 3px 4px rgba(255,255,255,.4), inset 0 -4px 10px rgba(0,0,0,.15)}
  .badge svg{width:84px;height:84px;display:block}
  .label{font-size:64px;font-weight:800;color:#fff;letter-spacing:.5px;text-shadow:0 3px 10px rgba(0,0,0,.45)}
  .sub{font-size:31px;font-weight:500;color:rgba(255,255,255,.56);margin-top:-16px;letter-spacing:.3px}
</style></head>
<body>
  <div class="card">
    <div class="badge" style="--glow:rgba(59,130,246,.55);background:linear-gradient(135deg,#3b82f6,#22d3ee)">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke-width="2.9"/></svg>
    </div>
    <div class="label">Drug Info</div><div class="sub">Search &amp; reference</div>
  </div>

  <div class="card">
    <div class="badge" style="--glow:rgba(16,185,129,.55);background:linear-gradient(135deg,#14b8a6,#10b981)">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10.4 13.6a3.6 3.6 0 0 0 5.1 0l3-3a3.6 3.6 0 0 0-5.1-5.1l-1.5 1.5"/><path d="M13.6 10.4a3.6 3.6 0 0 0-5.1 0l-3 3a3.6 3.6 0 0 0 5.1 5.1l1.5-1.5"/></svg>
    </div>
    <div class="label">Compatibility</div><div class="sub">Y-site check</div>
  </div>

  <div class="card">
    <div class="badge" style="--glow:rgba(139,92,246,.55);background:linear-gradient(135deg,#8b5cf6,#6366f1)">
      <svg viewBox="0 0 24 24"><path d="M12 3C12 3 5 10.5 5 15a7 7 0 0 0 14 0C19 10.5 12 3 12 3Z" fill="#fff"/><path d="M14.5 12.5a2.5 2.5 0 0 1-3 3" fill="none" stroke="#8b5cf6" stroke-width="1.7" stroke-linecap="round"/></svg>
    </div>
    <div class="label">Renal Dosing</div><div class="sub">Adjust by GFR</div>
  </div>

  <div class="card">
    <div class="badge" style="--glow:rgba(14,165,233,.55);background:linear-gradient(135deg,#0ea5e9,#3b82f6)">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="3.2"/><line x1="8.4" y1="7.2" x2="15.6" y2="7.2" stroke-width="2.2"/><g fill="#fff" stroke="none"><circle cx="9" cy="12" r="1.25"/><circle cx="12" cy="12" r="1.25"/><circle cx="15" cy="12" r="1.25"/><circle cx="9" cy="16.2" r="1.25"/><circle cx="12" cy="16.2" r="1.25"/><circle cx="15" cy="16.2" r="1.25"/></g></svg>
    </div>
    <div class="label">Calculators</div><div class="sub">CrCl · BSA · Rate</div>
  </div>

  <div class="card">
    <div class="badge" style="--glow:rgba(245,158,11,.55);background:linear-gradient(135deg,#f59e0b,#f97316)">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13"/><path d="M14.5 6 17.5 9 14.5 12"/><path d="M20 15H7"/><path d="M9.5 12 6.5 15 9.5 18"/></svg>
    </div>
    <div class="label">Interactions</div><div class="sub">Drug–drug</div>
  </div>

  <div class="card">
    <div class="badge" style="--glow:rgba(244,63,94,.55);background:linear-gradient(135deg,#f43f5e,#ef4444)">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.5 8.4-7 10-3.5-1.6-7-5-7-10V6z"/><path d="M9 12l2 2 4-4" stroke-linecap="round"/></svg>
    </div>
    <div class="label">Allergy</div><div class="sub">Cross-reactivity</div>
  </div>
</body></html>
